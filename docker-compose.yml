services:
  qq-mcp:
    build: .
    restart: unless-stopped
    environment:
      QQ_MCP_HOST: "0.0.0.0"
      QQ_MCP_PORT: "8888"
      QQ_MCP_PATH: "/mcp"
      QQ_MCP_ACCESS_TOKEN: "${QQ_MCP_ACCESS_TOKEN:?请设置}"
      # ⚠️ 这个值等 App 1 部署完、拿到地址再填
      NAPCAT_BASE_URL: "${NAPCAT_BASE_URL:?请设置}"
      NAPCAT_ACCESS_TOKEN: "${NAPCAT_ACCESS_TOKEN:?请设置}"
      QQ_MCP_ALLOW_RICH_MEDIA: "true"
      NAPCAT_TIMEOUT_SECONDS: "30"
      QQ_MCP_LOG_LEVEL: "INFO"
      QQ_MCP_LOG_MESSAGE_CONTENT: "false"
      QQ_MCP_ALLOW_RICH_MEDIA: "false"
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8888/health',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
